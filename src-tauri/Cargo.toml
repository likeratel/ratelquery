[package]
name = "ratelquery"
version = "0.2.0"
description = "A minimal, modern desktop client for MySQL, DynamoDB and Amazon Athena"
authors = ["harry"]
license = "MIT"
edition = "2024"

[lib]
name = "ratelquery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
# "unbounded_depth" only lifts serde_json's own recursion counter (it adds no crate); see
# ConnectionLayoutStore::load, which bounds the real nesting itself before relying on it.
serde_json = { version = "1", features = ["unbounded_depth"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "json", "rust_decimal", "bigdecimal", "time", "uuid"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-athena = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-types = "1"
aws-credential-types = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
csv = "1"
dirs = "6"
futures-util = "0.3"
url = "2"
# Same rustls as sqlx; used only to install the process-wide crypto provider (see mysql/options.rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
russh = "0.64.1"
hmac = "0.13"
sha1 = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
