name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend check and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test

  backend:
    name: Rust check and test
    runs-on: ubuntu-24.04
    env:
      RATELQUERY_TEST_MYSQL_URL: mysql://dev:dev@127.0.0.1:3307/sample
      RATELQUERY_TEST_DYNAMODB_ENDPOINT: http://localhost:8000
      RATELQUERY_TEST_SSH: 127.0.0.1:2222
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Nothing is installed in this job, so there is no pnpm store to cache.
          package-manager-cache: false
      # Started first so the containers initialise while Rust compiles.
      - name: Start MySQL, DynamoDB Local and the SSH bastion
        run: pnpm db:up
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Wait for databases
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' ratelquery-mysql)"
            [[ "$status" == "healthy" ]] && break
            sleep 2
          done
          if [[ "$status" != "healthy" ]]; then
            echo "::error::MySQL did not become healthy (status: $status)."
            exit 1
          fi
          docker exec ratelquery-mysql mysql -h127.0.0.1 -udev -pdev sample -e 'SELECT 1' > /dev/null
          dynamodb=down
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && dynamodb=up && break
            sleep 2
          done
          if [[ "$dynamodb" != "up" ]]; then
            echo "::error::DynamoDB Local is not reachable on :8000."
            exit 1
          fi
          for _ in $(seq 1 30); do
            banner="$(timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222; head -c 4 <&3' 2>/dev/null || true)"
            [[ "$banner" == "SSH-" ]] && exit 0
            sleep 2
          done
          echo "::error::The SSH bastion is not answering on :2222."
          exit 1
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Database logs on failure
        if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # audit-check reports its findings as a check run.
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
